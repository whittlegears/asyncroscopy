<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asyncroscopy Operator</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b1f24; --muted:#5f6b7a; --line:#dde2e8; --accent:#2457c5;
          --ok:#1f7a3f; --warn:#a15c00; --bad:#b3261e; --chip:#eef1f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --panel:#1c2026; --ink:#e7eaee; --muted:#9aa5b1;
          --line:#2c323a; --accent:#7aa2ff; --ok:#5fc47f; --warn:#e0a345; --bad:#ff7a70; --chip:#262b33; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:var(--chip);
           color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #stop { background:var(--bad); color:#fff; border-color:var(--bad); font-weight:700; margin-left:auto; }
  .state { color:var(--muted); }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  h2 { font-size:14px; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  #queue td:nth-child(5) { word-break:break-all; }
  td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.child td:nth-child(3) { padding-left:22px; color:var(--muted); }
  .chip { display:inline-block; padding:0 6px; border-radius:10px; background:var(--chip); font-size:12px; }
  .s-done,.s-match { color:var(--ok); } .s-running { color:var(--accent); font-weight:600; }
  .s-error,.s-refused,.s-denied,.s-rejected,.s-no_match { color:var(--bad); }
  .s-awaiting_approval,.s-ambiguous,.s-not_converged,.s-aborted,.s-skipped { color:var(--warn); }
  .sites { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
  .site { border:1px solid var(--line); border-radius:6px; padding:4px; cursor:pointer; }
  .site.sel { outline:2px solid var(--accent); }
  .site img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#000; border-radius:4px; }
  .site small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .compare img { width:100%; background:#000; border-radius:4px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  input[type=text] { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
                     background:var(--bg); color:var(--ink); }
  .muted { color:var(--muted); } .err { color:var(--bad); white-space:pre-wrap; }
  .scroll { max-height:60vh; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>Operator</h1>
  <button id="pause">Pause</button><button id="resume">Resume</button><button id="step">Step</button>
  <button id="abort">Abort current</button>
  <button id="takeover">Take over</button><button id="release">Release</button>
  <span class="state" id="state">connecting…</span>
  <button id="stop" title="Stops the instrument now. Does not go through the queue.">STOP</button>
</header>
<main>
  <section>
    <h2>Action queue <span class="muted">(agent, operator and recipe actions, in order)</span></h2>
    <div class="row"><input type="text" id="recipeName" placeholder="recipe name">
      <button id="saveRecipe">Save checked as recipe</button></div>
    <div class="scroll"><table><thead><tr><th style="width:24px"></th><th style="width:70px">id</th><th>action</th><th style="width:72px">by</th><th style="width:90px">site</th><th style="width:96px">status</th><th style="width:110px"></th></tr></thead>
      <tbody id="queue"></tbody></table></div>
    <div id="qerr" class="err"></div>
  </section>
  <section>
    <h2>Specimen atlas <span class="muted" id="mount"></span></h2>
    <div class="row"><input type="text" id="siteName" placeholder="site name">
      <label><input type="checkbox" id="landmark"> landmark</label>
      <button id="saveSite">Save current position</button>
      <button id="calibrate">Calibrate mapping</button>
      <button id="remount">Specimen remounted</button>
      <button id="reacquire">Reacquire landmarks</button></div>
    <div class="sites" id="sites"></div>
    <div id="detail" style="margin-top:12px"></div>
    <h2 style="margin-top:16px">Recipes</h2>
    <table><tbody id="recipes"></tbody></table>
    <div id="rerr" class="err"></div>
  </section>
</main>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('token') || '';
const base = location.pathname.replace(/\/(ui)?\/?$/, '');
const auth = token ? {Authorization: 'Bearer ' + token} : {};
const tq = token ? ('?token=' + encodeURIComponent(token)) : '';
let selected = null, checked = new Set();
async function api(method, path, body) {
  const r = await fetch(base + '/' + path, {method, headers: {...auth, 'Content-Type': 'application/json'},
                                            body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=1) => v == null ? '—' : Number(v).toFixed(d);
function guard(el, fn) { return async () => { el.textContent=''; try { await fn(); } catch (e) { el.textContent = e.message; } refresh(); }; }
const qerr = document.getElementById('qerr'), rerr = document.getElementById('rerr');
for (const op of ['pause','resume','step','abort','release']) document.getElementById(op).onclick = guard(qerr, () => api('POST', op));
document.getElementById('takeover').onclick = guard(qerr, () => api('POST', 'take-over', {note: 'operator took over from the UI'}));
document.getElementById('stop').onclick = guard(qerr, async () => { const r = await api('POST', 'stop'); qerr.textContent = 'STOP: ' + JSON.stringify(r.result ?? r.error); });
document.getElementById('saveSite').onclick = guard(rerr, () => api('POST', 'atlas/sites', {name: document.getElementById('siteName').value || 'site', landmark: document.getElementById('landmark').checked}));
document.getElementById('calibrate').onclick = guard(rerr, () => api('POST', 'atlas/calibrate', {}));
document.getElementById('remount').onclick = guard(rerr, () => confirm('Mark the specimen as remounted? Saved coordinates become a rough guess until landmarks are reacquired.') && api('POST', 'atlas/remount', {}));
document.getElementById('reacquire').onclick = guard(rerr, () => api('POST', 'atlas/landmarks/reacquire', {}));
document.getElementById('saveRecipe').onclick = guard(qerr, () => api('POST', 'recipes/from-actions', {name: document.getElementById('recipeName').value || 'recipe', action_ids: [...checked]}));

function renderQueue(snap) {
  const s = snap.state;
  document.getElementById('state').textContent = (s.paused ? 'PAUSED' : 'running') + ' · control: ' + s.controller +
    ' · queued ' + s.queued + (s.current ? ' · now ' + s.current : '');
  const rows = snap.actions.slice().reverse().map(a => {
    const child = !!a.parent_id;
    const btns = [];
    if (a.status === 'awaiting_approval') btns.push(`<button data-op="approve" data-id="${a.id}">Approve</button><button data-op="deny" data-id="${a.id}">Deny</button>`);
    if (['queued','awaiting_approval'].includes(a.status)) btns.push(`<button data-op="skip" data-id="${a.id}">Skip</button>`);
    const box = !child && a.status === 'done' ? `<input type="checkbox" data-check="${a.id}" ${checked.has(a.id)?'checked':''}>` : '';
    const detail = esc(a.error || a.approval_reason || a.result || '');
    return `<tr class="${child?'child':''}"><td>${box}</td><td class="muted">${esc(a.id)}</td><td title="${esc(JSON.stringify(a.args))}">${esc(a.label)}<div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${detail}</div></td>
      <td><span class="chip">${esc(a.origin)}</span></td><td>${esc(a.site_id||'')}</td><td class="s-${a.status}">${esc(a.status)}</td><td>${btns.join('')}</td></tr>`;
  });
  document.getElementById('queue').innerHTML = rows.join('');
  document.querySelectorAll('[data-op]').forEach(b => b.onclick = guard(qerr, () => api('POST', `actions/${b.dataset.id}/${b.dataset.op}`)));
  document.querySelectorAll('[data-check]').forEach(b => b.onchange = () => b.checked ? checked.add(b.dataset.check) : checked.delete(b.dataset.check));
}
let lastAtlas = '';
function renderAtlas(atlas) {
  const t = atlas.mount.transform;
  document.getElementById('mount').textContent = `(${atlas.mount.id}; rotation ${fmt(t.rotation_deg,2)}°, mapping ${atlas.mapping.calibrated ? 'calibrated' : 'NOT calibrated'})`;
  const key = JSON.stringify(atlas.sites.map(s => [s.id, s.visits]));
  if (key !== lastAtlas) {
    lastAtlas = key;
    document.getElementById('sites').innerHTML = atlas.sites.map(s => {
      const v = s.last_visit;
      return `<div class="site ${s.id===selected?'sel':''}" data-site="${s.id}"><img loading="lazy" src="${base}/atlas/sites/${s.id}/reference.png${tq}">
        <small>${s.landmark ? '◆ ' : ''}${esc(s.name)}</small><small class="${v ? 's-'+v.status : 'muted'}">${v ? v.status + ' · ' + fmt(v.residual_nm) + ' nm' : 'not revisited'}</small></div>`;
    }).join('') || '<span class="muted">No saved sites yet.</span>';
    document.querySelectorAll('[data-site]').forEach(el => el.onclick = () => { selected = el.dataset.site; lastAtlas=''; showSite(); });
  }
}
async function showSite() {
  if (!selected) return;
  const s = await api('GET', `atlas/sites/${selected}`);
  const v = s.visits[s.visits.length - 1];
  let compare = '';
  if (v) {
    const d = await api('GET', `atlas/sites/${s.id}/visits/${v.id}`);
    compare = `<div class="row"><b class="s-${d.status}">${esc(d.status)}</b>
      residual ${fmt(d.residual_nm)} nm · ±${fmt(d.sigma_nm)} nm · ncc ${fmt(d.ncc,2)} · second peak ${d.ambiguity == null ? '—' : fmt(d.ambiguity*100,0) + '%'} · rotation ${fmt(d.rotation_deg,2)}° · by ${esc(d.requested_by)}</div>
      ${(d.reasons||[]).length ? `<div class="err">${d.reasons.map(esc).join('\n')}</div>` : ''}
      <div class="compare"><figure style="margin:0"><img src="${base}/atlas/sites/${s.id}/reference.png${tq}"><figcaption class="muted">original</figcaption></figure>
      <figure style="margin:0">${d.has_image ? `<img src="${base}/atlas/sites/${s.id}/visits/${v.id}.png${tq}">` : ''}<figcaption class="muted">${esc(d.image_kind)} image, visit ${esc(v.id)}</figcaption></figure></div>`;
  }
  document.getElementById('detail').innerHTML = `<div class="row"><b>${esc(s.name)}</b><span class="muted">${esc(s.id)} · fov ${fmt(s.fov_m*1e9,0)} nm · ${s.visits.length} visit(s)</span>
    <button class="primary" id="goSite">Return and acquire</button></div>${compare}`;
  document.getElementById('goSite').onclick = guard(rerr, () => api('POST', `atlas/sites/${s.id}/return`, {}));
}
function renderRecipes(list) {
  document.getElementById('recipes').innerHTML = list.recipes.map(r => `<tr><td><b>${esc(r.name)}</b> <span class="muted">${r.steps} steps · ${esc(r.hash)}</span></td>
    <td>${r.validated_on_twin ? '<span class="s-done">rehearsed on twin</span>' : '<span class="s-ambiguous">not rehearsed on twin</span>'}</td>
    <td><button data-rcheck="${esc(r.name)}">Check</button><button data-rrun="${esc(r.name)}">Run</button></td></tr>`).join('') || '<tr><td class="muted">No recipes yet. Tick finished actions and save them.</td></tr>';
  document.querySelectorAll('[data-rcheck]').forEach(b => b.onclick = guard(rerr, async () => { const c = await api('POST', `recipes/${b.dataset.rcheck}/check`); rerr.textContent = c.ok ? 'ready to run' : c.problems.join('\n'); }));
  document.querySelectorAll('[data-rrun]').forEach(b => b.onclick = guard(rerr, () => api('POST', `recipes/${b.dataset.rrun}/run`, {})));
}
let lastSeq = -1;
async function refresh() {
  try {
    const snap = await api('GET', 'state');
    renderQueue(snap);
    if (snap.state.last_event !== lastSeq) {
      lastSeq = snap.state.last_event;
      renderAtlas(await api('GET', 'atlas'));
      renderRecipes(await api('GET', 'recipes'));
      if (selected) showSite();
    }
  } catch (e) { document.getElementById('state').textContent = 'disconnected: ' + e.message; }
}
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
