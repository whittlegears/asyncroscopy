# The high-risk commands auto mode runs without a person, before an operator switches anything else on
# (Approvals.set_auto_allowed). Keys are device kinds the MCP server recognises at discovery
# ("stem": scans images and blanks a beam; "probe": brings a probe to the sample; "envelope": runs jobs),
# each with command globs, and "tools" with tool-name or Class.command globs for any device.
# A device may instead declare routine: true for a command in its action_hints.
# An MCP config replaces this file with mcp.safety.auto_routine.
#
# On an electron microscope: routine imaging, spectra, stage moves (the device refuses one outside its
# limits) and placing the beam. Every other high-risk command (column valves, screen, apertures,
# corrector, spectrometer set-up, calibration, a camera exposure, or any unknown or renamed command) is
# held in auto too. On any other instrument nothing is routine (an AFM's move_stage drags an engaged tip).
stem:
  - move_stage
  - acquire_scanned_image
  - acquire_scanned_data_advanced
  - acquire_spectrum
  - acquire_eels_spectrum
  - place_beam
  - place_beam_list
  - place_beam_at
  - unblank_beam
  - auto_focus
  - set_stigmator
  - set_beam_tilt
  - set_image_shift
  - aim_image_shift
