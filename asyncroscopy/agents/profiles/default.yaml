# The default agent profile: everything that depends on the model rather than on the instrument.
# Not the default any more (capable is, for gemma4:31b): choose it with ASYNCROSCOPY_AGENT_PROFILE=default.
# Tuned for a small local model and measured on qwen3:8b with an 8192-token context. capable.yaml extends it
# for models that need none of the small-model aids. Make another with `extends: default` and the keys that
# differ (ASYNCROSCOPY_AGENT_PROFILE=<name or path>); the instrument stack never reads it, except that the MCP
# server reports the tool selection below as endpoint_info.agent_tools.

model: qwen3:8b
model_provider: ollama
num_ctx: 8192

# The agent graphs' middleware, outermost first (asyncroscopy.agents.middleware):
# skills: puts matching skills and memory notes in the system prompt for each model call;
# user_words: holds a run_job map plan to the user's words (no unstated dose limit or EDS; the stage centre and the whole sample when asked);
# job_wait: waits out a running job inside one tool round; empty_reply: retries a reply with
# neither text nor a tool call; claim_check: checks a final answer against the run's tool calls.
middleware: [skills, user_words, job_wait, empty_reply, claim_check]

# How much a prompt carries (asyncroscopy.agents.skill_middleware). A small model follows one or two skills
# well, and skills, memory notes, tool schemas and the conversation share an 8k context.
skills:
  from_request: 2     # skills chosen from the request's words
  at_most: 4          # skills one run carries, with those added when a call fails, is held, ...
  prompt_chars: 7000  # skill text in the prompt (also at most a quarter of the context)
  notes_chars: 1500   # memory notes in the prompt
  passages: 3         # skill passages found for each step from the request and the latest tool replies
  passage_chars: 2000 # the most text those passages add

# Tools held back unless the request asks for what they do. A small model calls what it sees: it annotated maps
# it was asked only to describe, parked the beam for a closer image, and sent stage numbers to to_stage as pixels.
# A cue is words (a word ending in * matches any ending) or, after "re:", a regular expression; case is ignored.
tool_gates:
  - tools: [annotate, edit_annotation, add_poi, delete_annotation]
    offer_if: ["annotat*", "mark*", "label*", "pin*", "flag*", "tag*", "highlight*", "add*", "edit*", "delete*", "remove*",
               note, notes]
  - tools: ["*_place_beam", "*_place_beam_at"]
    offer_if: ["spectr*", eds, edx, x-ray, xray, element, elements, composition, chemistry, "park* the beam", place the beam,
               beam at, beam on]
  - tools: [to_stage, to_pixel]
    hide_if: ['re:\bx\s*=\s*[-+]?\d[\d.]*(?:e[-+]?\d+)?\s*(?:nm|um|µm|m)\b']

# Tool replies with structured fields (next_actions, warnings) are replaced by sentences saying what to do
# (asyncroscopy.agents.guidance): a small model acts on a sentence more reliably than on the fields.
replies: notes

# Images tools return (segment_sam, find_atoms_blobnet) go to the chat as the tool message's artifact. The model is
# shown them only with images: true, for a model that reads images; qwen3:8b does not.
images: false

# Which tools a tool-using model is given (asyncroscopy.mcp.agent_tools).
tools:
  # Tools every instrument endpoint and the analysis server offer. Left out, from the trial
  # traces are calls that always come as a pair or are always
  # made first. run_job is reserve+start, wait_for_job also waits on analysis jobs and returns results,
  # and the skills are put in the prompt. find_tools and call_tool reach every other tool of the endpoint.
  generic: [find_tools, call_tool, run_job, wait_for_job, list_devices, list_data, view_data,
            collect_map_run, assemble_map, score_map, map_info, get_region, list_pois, add_poi, list_scorers,
            annotate, list_annotations, edit_annotation, to_stage, to_pixel, place_image, find_features,
            # Workflow tools from the analysis server
            list_workflows, get_workflow, run_workflow, workflow_status, answer_workflow, stop_workflow, resume_workflow,
            list_blocks, propose_workflow]
  # A curated STEM set: a 4-8 B model loses track with all ~80 microscope tools.
  stem: ["*_get_stage", "*_get_sample", "*_move_stage", "*_get_parameters", "*_acquire_scanned_image", "*_acquire_spectrum",
         "*_set_fov", "*_get_fov", "*_aim_image_shift", "*_set_image_shift", "*_get_image_shift", "*_set_defocus", "*_place_beam",
         "*_place_beam_at", "*_blank_beam", "*_unblank_beam", "Mapper*_abort"]
  # Only when the instrument endpoint has no mcp.analysis_url does an agent need the analysis server's own waits.
  analysis_waits: [analysis_job_status, analysis_job_results]
  # For agent programs, not models: action_space is far too long for a small model's context.
  not_for_models: [list_skills, skills_for, notes_for, skill_text, save_skill, delete_skill, switch_skill, endpoint_info, action_space]

# The team graph (asyncroscopy.agents.graphs.team): which tools each specialist holds. Jobs go through
# run_job (reserve + start) and wait_for_job (which waits on instrument and analysis jobs and returns
# their results), so the envelope's separate tools and the analysis job tools stay on the endpoint but no
# specialist is given them. On an endpoint without an electron microscope the operator also gets every
# other device command, as the general agent does.
team:
  # The first role whose globs match a tool gets it: the analyst first, since its tools are never the instrument's.
  roles:
    analyst: [list_data, view_data, collect_map_run, assemble_map, score_map, map_info, get_region, list_pois, add_poi, list_scorers]
    operator: [run_job, "*_abort", "*_get_stage", "*_move_stage", "*_get_parameters", "*_acquire_*", "*_set_fov", "*_get_fov",
               "*_set_defocus", "*_place_beam", "*_blank_beam", "*_unblank_beam"]
  # Both specialists get these. load_skill is shown to a model only while a matched skill did not fit its prompt.
  shared: [wait_for_job, load_skill]
  # Never given to a specialist: covered by run_job / wait_for_job, or skills come to the agent.
  hidden: ["*_reserve", "*_start", "*_job_status", "*_results", "*_release", "analysis_job_*", list_skills, skills_for, notes_for, skill_text, save_skill, delete_skill, switch_skill, endpoint_info,
           action_space, "*_State", "*_Status", "*_Init"]
