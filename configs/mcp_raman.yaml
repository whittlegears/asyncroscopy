# Agent MCP endpoint for the Raman twin (configs/yaml_sim_raman.yaml), beside the
# STEM twin's endpoints (8000 agent, 8001 operator, 8003 analysis):
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_raman.yaml
#
# Point an agent at it with ASYNCROSCOPY_MCP_URL=http://127.0.0.1:8100/mcp.
# See docs/Adding_New_Hardware/second_stack.md.

tango:
  host: localhost
  port: 9194

mcp:
  name: Raman_MCP
  transport: streamable-http
  http_host: 127.0.0.1
  http_port: 8100
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  # Held on the agent endpoint until a person approves the exact call (docs/MCP/permissions.md), unless a person
  # sets a tool otherwise. Init, Kill, RestartServer and Disconnect are never run, whatever is set.
  needs_approval:
    # Every agent configuration holds at least what configs/mcp_dt.yaml holds (tests/agents/test_agent_configs.py).
    DATA: [configure, copy_and_register_remote_file, reconcile, register_path, start_tiled_server, stop_tiled_server]
    CEOSCorrector: [correct, correct_aberration, measure_aberrations, measure_c1a1, acquire_tableau]
    DigitalTwinCorrector: [correct, correct_aberration, measure_aberrations, measure_c1a1, acquire_tableau]
  permissions_file: ../outputs/permissions/permissions.json
  approval_ttl_s: 600
  include_only_functions: []
  tool_log: ""
  # No map analysis for a Raman microscope (no urls.analysis): wait_for_job waits on this stack's job devices only.
  endpoint_role: agent
  safety:
    risk: {}
  trace: outputs/trace/mcp_raman.jsonl
