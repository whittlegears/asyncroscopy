# Agent MCP endpoint for the Raman twin (configs/yaml_sim_raman.yaml), beside the
# STEM twin's endpoints (8000 agent, 8001 operator, 8003 analysis):
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_raman.yaml
#
# Point an agent at it with ASYNCROSCOPY_MCP_URL=http://127.0.0.1:8100/mcp.
# See docs/Adding_New_Hardware/second_stack.md.

tango:
  host: localhost
  port: 9194

mcp:
  name: Raman_MCP
  transport: streamable-http
  http_host: 127.0.0.1
  http_port: 8100
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
    DATA: [configure, copy_and_register_remote_file, reconcile, register_path, start_tiled_server, stop_tiled_server]
    Mapper: [get_reservation]
    Tuner: [get_reservation]
    # Every agent configuration blocks at least what configs/mcp_dt.yaml blocks (tests/agents/test_agent_configs.py).
    # Until first light's sign test settles the CEOS correction's sign and units, the corrector is written only by the
    # Tuner (allow_corrector_writes) or a person.
    CEOSCorrector: [correct_aberration, measure_c1a1, acquire_tableau, set_aberrations_coeff_sim]
    DigitalTwinCorrector: [correct_aberration, measure_c1a1, acquire_tableau, set_aberrations_coeff_sim]
    # After Disconnect even the e-stop cannot blank the beam.
    AutoScriptMicroscope: [Disconnect]
    JeolMicroscope: [Disconnect]
    DigitalTwin: [Disconnect]
    DigitalTwinParticles: [Disconnect]
    DigitalTwinTilt: [Disconnect]
    DigitalTwinDiffraction: [Disconnect]
    PolycrystallineGoldDigitalTwin: [Disconnect]
  include_only_functions: []
  tool_log: ""
  # No map analysis for a Raman microscope: wait_for_job waits on this stack's job devices only.
  analysis_url: ""
  endpoint_role: agent
  safety:
    risk: {}
  trace: outputs/trace/mcp_raman.jsonl
