# Agent benchmark stack: the silicon-lamella tilt twin plus the corrector twin.
# Start it, then score agents with python -m asyncroscopy.bench (see docs/Operation/benchmark.md).
#
#   uv sync --extra diffraction
#   uv run startup_scripts/run_servers.py --yaml configs/benchmark_twin.yaml
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_benchmark.yaml
instrument:
  class_name: DigitalTwinTilt
  file: asyncroscopy/instruments/electron_microscope/digital_twin_tilt.py
  description: "Benchmark: silicon lamella tilt/diffraction twin with a corrector twin"
  timeout_seconds: 120
  properties:
    sample_seed: 731
    diffraction_image_size: 32
    diffraction_max_angle_mrad: 60
    convergence_angle_mrad: 4.7
    crystal_tilt_x_mrad: 3.0
    crystal_tilt_y_mrad: -2.0
    focus_drift_nm_per_degree: 1.4
    haadf_poisson_counts: 180

devices:
  camera:
    module_name: asyncroscopy.instruments.electron_microscope.detectors.camera
  corrector:
    class_name: DigitalTwinCorrector
    module_name: asyncroscopy.instruments.electron_microscope.hardware.corrector_digital_twin
    properties:
      random_seed: 1729
      measurement_noise_fraction: 0.02
  data:
    module_name: asyncroscopy.data.data
  scan:
    module_name: asyncroscopy.instruments.electron_microscope.hardware.scan
  stage:
    class_name: TestStage
    module_name: asyncroscopy.instruments.electron_microscope.hardware.TestStage

tango:
  host: 127.0.0.1
  port: 9094
  reset_database_file: true

tiled:
  host: 127.0.0.1
  port: 9091
  acquisition_dir: outputs/tiled_acquisitions
  autostart: true
  register_on_startup: false

device_timeout_seconds: 120
