# Machine-learning suggestions MCP server (torch lives only here).
#
# Install its dependencies with:   uv sync --extra ml
# Start it with:                   uv run startup_scripts/run_ml.py --yaml configs/ml.yaml
#
# It never moves the instrument. It reads images by data key from Tiled (set tiled_uri to
# the DATA device's Tiled server) and returns suggested settings or probe positions. The
# calibration procedures server calls it when a procedure runs with optimizer "bayesian".

ml:
  name: ML_Suggestions
  http_host: 127.0.0.1
  http_port: 8011
  tiled_uri: http://127.0.0.1:9091
  output_dir: outputs/ml
