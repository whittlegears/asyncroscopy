# Gemma4 31B local model startup config for LLM Tango device.

agent:
  name: Asyncroscopy_Agent_MCP
  transport: streamable-http
  http_host: 127.0.0.1
  http_port: 8002
  model: "gemma4:31b"
  model_provider: "ollama"
  max_steps: 10
  use_init_chat_model: false

  mcp_urls:
    - "http://127.0.0.1:8000/mcp"

  # The other endpoints endpoint_info reports (docs/MCP/permissions.md); leave one out when it does not run.
  urls:
    workflow_operator: http://127.0.0.1:8004/mcp

  # Workflows run in this process (on by default; the one place they run), on a twin and on the real instrument. The real instrument needs http_host 127.0.0.1
  # because this server has no login.
  workflows: true
  workflows_hardware: true

  startup_agents:
    - name: "base"
      system_prompt: "You are a helpful assistant that can answer questions and provide information."
      tools: ["list_devices"]
    - name: "image"
      system_prompt: "You are an image acquiring assistant."
      tools: ["*image"]