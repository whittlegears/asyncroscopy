# Gemma4 31B local model startup config for LLM Tango device.

agent:
  name: Asyncroscopy_Agent_MCP
  transport: streamable-http
  http_host: 0.0.0.0
  http_port: 8002
  model: "gemma4:31b"
  model_provider: "ollama"
  max_steps: 10
  use_init_chat_model: false
  # Every prompt and output is recorded here as JSON-lines training data
  # (see asyncroscopy/training). Remove the line to turn it off.
  training_log_dir: outputs/training_data

  mcp_urls:
    - "http://127.0.0.1:8000/mcp"
    # The pyTEMlib analysis server, for the sample_map workflow (stitching, scoring,
    # points of interest, notes). Start it with
    #   uv run python -m pyTEMlib.analysis_server --tiled http://localhost:9091 --api-key secret --port 8003
    # If it is not running the agents start without it and list_workflows names the missing tools.
    - "http://127.0.0.1:8003/mcp"

  startup_agents:
    - name: "base"
      system_prompt: "You are a helpful assistant that can answer questions and provide information."
      tools: ["list_devices"]
    - name: "image"
      system_prompt: "You are an image acquiring assistant."
      tools: ["*image"]