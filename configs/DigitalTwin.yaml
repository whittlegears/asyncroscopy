# A simulator: approval auto mode is allowed, and the MCP endpoint may bind 0.0.0.0 (docs/Operation/dry_run.md).
simulated: true

instrument:
  class_name: DigitalTwin
  file: asyncroscopy/instruments/electron_microscope/digital_twin.py
  description: "Digital Twin Simulation Environment"
  timeout_seconds: 120

devices:
  camera:
    module_name: asyncroscopy.instruments.electron_microscope.detectors.camera
  data:
    module_name: asyncroscopy.data.data
  eds:
    module_name: asyncroscopy.instruments.electron_microscope.detectors.eds
  scan:
    module_name: asyncroscopy.instruments.electron_microscope.hardware.scan
  # Background map jobs (reserve/start/status/abort/results/release) on this microscope.
  mapper:
    class_name: Mapper
    module_name: asyncroscopy.jobs.mapping.mapper
    properties:
      microscope_device_address: asyncroscopy/instrument/default
      scan_device_address: asyncroscopy/scan/default
      eds_device_address: asyncroscopy/eds/default
      data_device_address: asyncroscopy/data/default
  # Autofocus and stigmation jobs: run_job(device="Tuner", plan={...}); see docs/Operation/autofocus.md.
  tuner:
    class_name: Tuner
    module_name: asyncroscopy.instruments.electron_microscope.tuner
    properties:
      microscope_device_address: asyncroscopy/instrument/default
      scan_device_address: asyncroscopy/scan/default
      corrector_device_address: asyncroscopy/corrector/default
      data_device_address: asyncroscopy/data/default
  # Approval mode (auto by default); switched from SciAgentGUI.
  approvals:
    class_name: Approvals
    module_name: asyncroscopy.safety.approvals
  stage:
    module_name: asyncroscopy.instruments.electron_microscope.hardware.stage
  corrector:
    class_name: DigitalTwinCorrector
    module_name: asyncroscopy.instruments.electron_microscope.hardware.corrector_digital_twin

tango:
  host: localhost
  port: 9094
  reset_database_file: true

tiled:
  host: localhost
  port: 9091
  acquisition_dir: outputs/tiled_acquisitions
  autostart: true
  register_on_startup: false

device_timeout_seconds: 120
