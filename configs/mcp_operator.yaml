# Operator MCP endpoint for SciAgentGUI (stop, ground truth).
#
# Start the Tango/device stack first, then run this on the GUI machine:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_operator.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP.
#
# Keep http_host at 127.0.0.1: this endpoint has operator-only tools
# and no authentication. Run it on the GUI's machine.

tango:
  host: localhost
  port: 9094

mcp:
  name: Operator_MCP
  transport: streamable-http
  http_host: 127.0.0.1
  http_port: 8001
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
  # Optional Tango command allowlist. Leave empty to include all non-blocked
  # commands. Entries may be "command" or "Class.command".
  # list_devices, list_data and view_data are always included.
  include_only_functions: []
  # Optional JSONL log of tool calls. Empty disables it.
  tool_log: ""
  # Operator endpoint: bound to 127.0.0.1 so only this machine (the GUI) reaches
  # it. It offers export_ground_truth.
  endpoint_role: operator
  safety:
    # Optional {"Class.command" or tool-name ("Class_command") glob: low|high}, first match wins, checked before the defaults in
    # asyncroscopy/safety/policy.py. Unknown commands are high risk.
    risk: {}
  # Instrument Trace: one JSON line per tool call. Empty disables it.
  trace: outputs/trace/mcp_operator.jsonl
  # The instrument whose clock_s (simulated time on the twin) stamps each trace event. Empty: this computer's time.
  clock_device: asyncroscopy/instrument/default
  # What trace_since (operator only: the GUI follows the trace with it) reads. Empty: every *.jsonl next to trace.
  trace_follow: [outputs/trace]
