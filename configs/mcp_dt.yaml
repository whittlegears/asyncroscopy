# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_dt.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP. Set mcp.http_host to 0.0.0.0 when other machines need to connect.

tango:
  host: localhost
  port: 9094

mcp:
  name: Spectra300_MCP
  transport: streamable-http
  http_host: 0.0.0.0
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
      # Twin-only answers: hidden so the agent is graded on what it measures.
      - get_ground_truth
      - get_aberrations_coeff_sim
      - set_aberrations_coeff_sim
  # Optional Tango command allowlist. Leave empty to include all non-blocked
  # commands. Entries may be "command" or "Class.command".
  # list_devices and get_data_from_key are always included.
  include_only_functions: []
  # Optional JSONL log of tool calls. Empty disables it.
  tool_log: ""
  # Commands an agent's call does not run until an operator approves it on the
  # operator endpoint (configs/mcp_dt_operator.yaml, same approvals_db). Patterns
  # by Tango class or "*"; "Class.command" also works. See asyncroscopy/mcp/approvals.py.
  needs_approval:
    "*":
      - move_stage
      - acquire_map_grid
      - correct_aberration
      - set_column_valves
      - unblank_beam
  approvals_db: outputs/approvals.sqlite
