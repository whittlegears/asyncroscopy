# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_dt.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP. Set mcp.http_host to 0.0.0.0 when other machines need to connect.

tango:
  host: localhost
  port: 9094

mcp:
  name: Spectra300_MCP
  transport: streamable-http
  http_host: 0.0.0.0
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
  # Optional Tango command allowlist. Leave empty to include all non-blocked
  # commands. Entries may be "command" or "Class.command".
  # list_devices and get_data_from_key are always included.
  include_only_functions: []
  # Optional JSONL log of tool calls. Empty disables it.
  tool_log: ""
  # One action queue for the operator and the agent, the specimen atlas, and
  # recipes. When enabled, every device tool the agent calls is queued and
  # checked against the policy below, and the operator API/page is served at
  # http://<http_host>:<http_port>/supervision/ui (SciAgentGUI uses the same API).
  supervision:
    enabled: true
    dir: outputs/supervision          # history.jsonl, atlas/, recipes/
    specimen_id: digital-twin-sample
    instrument_kind: auto             # twin | real | auto (twin when the instrument class is a DigitalTwin)
    operator_token: ""                # set to require "Authorization: Bearer <token>" on the operator API
    agent_wait_s: 50                  # agent calls wait this long in the queue before getting a "still queued" reply
    detector: haadf
    stop_commands:                    # run directly by STOP, never through the queue
      - instrument.blank_beam
    policy:
      forbid: []
      require_approval:
        - "*set_column_valves"
        - "*set_screen"
      stage_limits:                   # metres / degrees
        x: [-1.0e-6, 1.0e-6]
        y: [-1.0e-6, 1.0e-6]
        alpha: [-35, 35]
      max_step_xy_m: null
      arg_limits: {}
      require_twin_validation: true
