# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_dt.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP. Set mcp.http_host to 0.0.0.0 when other machines need to connect.

tango:
  host: localhost
  port: 9094

mcp:
  name: Spectra300_MCP
  transport: streamable-http
  http_host: 0.0.0.0
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
  # Optional Tango command allowlist. Leave empty to include all non-blocked
  # commands. Entries may be "command" or "Class.command".
  # list_devices and get_data_from_key are always included.
  include_only_functions: []
  # Optional JSONL log of tool calls. Empty disables it.
  tool_log: ""
  # Agent endpoint: operator-only commands (Approvals.approve/deny/set_mode,
  # export_ground_truth) are never offered here. The GUI uses mcp_operator.yaml.
  endpoint_role: agent
  # Approval mode lives in the Approvals device; switch it from the GUI.
  # auto (default) runs every call; approve holds high-risk agent calls.
  safety:
    approvals_device_address: asyncroscopy/approvals/default
    # Optional {"Class.command" glob: low|high} checked before the defaults in
    # asyncroscopy/safety/policy.py. Unknown commands are high risk.
    risk: {}
  # Instrument Trace: one JSON line per tool call. Empty disables it.
  trace: outputs/trace/mcp_agent.jsonl
