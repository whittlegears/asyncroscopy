# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_dt.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP.
#
# http_host is 127.0.0.1 so only this machine can reach the endpoint: it has no
# authentication, so anyone who can reach it can drive the instrument. To let
# other machines connect, set http_host to this machine's LAN address (or
# 0.0.0.0) on a trusted network only. See docs/Operation/quickstart.md. A name other
# than this machine's own (a proxy's) goes in mcp.allowed_hosts (docs/Operation/remote_access.md).

tango:
  host: localhost
  port: 9094

mcp:
  name: DigitalTwin_MCP
  transport: streamable-http
  http_host: 127.0.0.1
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  # Held on the agent endpoint until a person approves the exact call (docs/MCP/permissions.md), unless a person
  # sets a tool otherwise. Init, Kill, RestartServer and Disconnect are never run, whatever is set.
  needs_approval:
    DATA: [configure, copy_and_register_remote_file, reconcile, register_path, start_tiled_server, stop_tiled_server]
    # The same as configs/mcp.yaml on hardware, on the twin's classes too, so an agent rehearsing here meets what it will
    # meet there. Until first light's sign test settles the CEOS correction's sign and units, a person approves each write.
    CEOSCorrector: [correct_aberration, measure_c1a1, acquire_tableau]
    DigitalTwinCorrector: [correct_aberration, measure_c1a1, acquire_tableau]
  permissions_file: outputs/permissions/permissions.json
  approval_ttl_s: 600
  # Optional Tango command allowlist. Leave empty to include every command. Entries may be "command" or "Class.command".
  # list_devices, list_data and view_data are always included.
  include_only_functions: []
  # Optional JSONL log of tool calls. Empty disables it.
  tool_log: ""
  # The other endpoints of this stack, as endpoint_info reports them; leave one out when it does not run.
  # With analysis (pyTEMlib.analysis_server: stitching, scoring), wait_for_job also waits on assemble_map and
  # score_map jobs and returns their results, so an agent needs one wait tool for every job.
  urls:
    operator: http://127.0.0.1:8001/mcp
    agent_server: http://127.0.0.1:8002/mcp
    workflow_operator: http://127.0.0.1:8004/mcp
    tiled: http://localhost:9091
    analysis: http://127.0.0.1:8003/mcp
  # run_job refuses a plan whose estimate is over these (the agent tells the user the
  # estimate and asks); raise them here for long runs. Empty: no limit beyond the job
  # device's own. 
  job_limits:
    max_duration_s: 14400
    # The highest dose a plan may put on any spot. EDS point spectra count: a parked 50 pA beam gives about
    # 30 000 e/A^2 per second of exposure on its 10 nm spot (EDS_DOSE_SPREAD_M), so a 1 s EDS map
    # needs this much headroom. A plan's own dose_budget_e_per_a2 (what a user asks for) is still enforced.
    max_dose_e_per_a2: 50000
  # Agent endpoint: operator-only commands (export_ground_truth,
  # export_ground_truth) are never offered here. The GUI uses mcp_operator.yaml.
  endpoint_role: agent
  safety:
    # Optional {"Class.command" or tool-name ("Class_command") glob: low|high}, first match wins, checked before the defaults in
    # asyncroscopy/safety/policy.py. Unknown commands are high risk.
    risk: {}
  # Instrument Trace: one JSON line per tool call. Empty disables it.
  trace: outputs/trace/mcp_agent.jsonl
  # The instrument whose clock_s (simulated time on the twin) stamps each trace event. Empty: this computer's time.
  clock_device: asyncroscopy/instrument/default
