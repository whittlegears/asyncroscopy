# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP. Set mcp.http_host to 0.0.0.0 when other machines need to connect.

tango:
  host: 10.46.217.241
  port: 9094

mcp:
  name: Spectra300_MCP
  transport: streamable-http
  http_host: 0.0.0.0
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
  # The analysis server (pyTEMlib: stitching, scoring) on the MCP host, so
  # wait_for_job also waits on assemble_map and score_map jobs; agents read this
  # address from the endpoint (endpoint_info). Empty: no analysis server.
  analysis_url: http://127.0.0.1:8003/mcp
  # The approval gate. The hardware run_servers configs start an Approvals device in approve mode,
  # so every high-risk agent call waits for a person (SciAgentGUI's chat, or the operator endpoint).
  # This endpoint listens on 0.0.0.0: keep the gate on whenever other machines can reach it.
  safety:
    approvals_device_address: asyncroscopy/approvals/default
    risk: {}
  # run_job refuses a plan whose estimate is over these (the agent must ask the user).
  job_limits:
    max_duration_s: 14400
    max_dose_e_per_a2: 5000
