# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp.yaml
#
# tango.host is localhost: run this on the PC that hosts the Tango database. If MCP
# runs on a separate computer, set tango.host to that machine (its address is the
# tango: section of configs/Spectra300.yaml).
# The Spectra 300 stack is not simulated (simulated: false), so http_host 0.0.0.0
# alone still binds 127.0.0.1: when other machines must connect, set
# http_host: 0.0.0.0 and allow_remote_bind: true together.

tango:
  host: localhost
  port: 9094

mcp:
  name: Spectra300_MCP
  transport: streamable-http
  http_host: 127.0.0.1
  # allow_remote_bind: true   # only with http_host 0.0.0.0 and mcp.auth set
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  # Held on the agent endpoint until a person approves the exact call (docs/MCP/permissions.md), unless a person
  # sets a tool otherwise. Init, Kill, RestartServer and Disconnect are never run, whatever is set.
  needs_approval:
    # tests/agents/test_agent_configs.py checks that every agent configuration holds at least what configs/mcp_dt.yaml holds.
    DATA: [configure, copy_and_register_remote_file, reconcile, register_path, start_tiled_server, stop_tiled_server]
    # Until first light's sign test settles the CEOS correction's sign and units, a person approves each write. The
    # hardware's allow_corrector_writes still decides whether the corrector takes one at all.
    CEOSCorrector: [correct, correct_aberration, measure_aberrations, measure_c1a1, acquire_tableau]
    DigitalTwinCorrector: [correct, correct_aberration, measure_aberrations, measure_c1a1, acquire_tableau]
  permissions_file: ../outputs/permissions/permissions.json
  approval_ttl_s: 600
  include_only_functions: []
  tool_log: ""
  # The other endpoints of this stack, as endpoint_info reports them; leave one out when it does not run. With analysis
  # (pyTEMlib.analysis_server: stitching, scoring) on the MCP host, wait_for_job also waits on assemble_map and
  # score_map jobs; agents read the address from endpoint_info.
  urls:
    tiled: http://127.0.0.1:9091
    analysis: http://127.0.0.1:8003/mcp
  # Risk overrides: {"Class.command" or tool-name glob: low|high}.
  safety:
    risk: {}
  # Bearer tokens from the facility's token service (docs/Operation/remote_access.md). Required before this
  # hardware endpoint binds beyond 127.0.0.1; run_mcp.py refuses to start it otherwise.
  # auth:
  #   jwks_url: https://tokens.example.org/.well-known/jwks.json
  #   issuer: https://tokens.example.org
  #   audience: asyncroscopy:spectra300
  # run_job refuses a plan whose estimate is over these (the agent must ask the user).
  job_limits:
    max_duration_s: 14400
    max_dose_e_per_a2: 5000
  # Agent endpoint: operator-only commands are never offered here. The GUI uses this endpoint too (stop_all, jobs).
  endpoint_role: agent
  # Instrument Trace: one JSON line per tool call. The clock is this computer's on hardware.
  trace: outputs/trace/mcp_agent.jsonl
