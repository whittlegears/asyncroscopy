# pyTEMlib analysis MCP server for the digital twin on this computer
#
#   uv run startup_scripts/run_pytemlib.py --yaml configs/pytemlib.yaml
#   uv run startup_guis/pytemlib_mcp.py
#
# Each key is an option of `python -m pytemlib_mcp.analysis_server`.
# A key left out keeps the server's default.
# Keep host at 127.0.0.1 because this server has no login.

pytemlib:
  transport: streamable-http
  host: 127.0.0.1
  port: 8003
  tiled: http://localhost:9091
  # The default key from run_servers.py
  api_key: secret
  # Folders whose files the analysis tools may read. Blank: the project folder only.
  # The STEM Workbench in Angstrom analyses its workspace files here, so add Angstrom's media folder, e.g.
  #   Windows: C:/Users/<you>/AppData/Roaming/com.sciagentgui.app/media
  #   macOS:   /Users/<you>/Library/Application Support/com.sciagentgui.app/media
  # local_roots: [., C:/Users/<you>/AppData/Roaming/com.sciagentgui.app/media]
