# pyTEMlib analysis MCP server for the Spectra 300
# Run it on the MCP host next to the agent endpoint from configs/mcp.yaml
#
#   uv run startup_scripts/run_pytemlib.py --yaml configs/pytemlib_spectra300.yaml
#
# Keep host at 127.0.0.1 because this server has no login.

pytemlib:
  transport: streamable-http
  host: 127.0.0.1
  port: 8003
  # Tiled on the microscope PC
  tiled: http://10.46.217.241:9091
  # Maps are saved in this folder so Tiled is only read and needs no key
  local_runs: outputs/maps
  # The agent server offers the workflow tools (configs/gemma-llm.yaml), so they are off here.
  workflows: false
