# Digital twin with every realistic effect switched on, for mapping workflows.
#
#   uv run startup_scripts/run_servers.py --yaml configs/digital_twin_mapping.yaml
#
# Values come from the literature or are placeholders to calibrate against the
# Spectra 300 (see asyncroscopy/calibration/ and docs/digital_twin.md). Set
# time_scale to 0 to run without waiting for simulated stage moves and frames.

# A simulator: approval auto mode is allowed, and the MCP endpoint may bind 0.0.0.0 (docs/Operation/dry_run.md).
simulated: true

instrument:
  class_name: DigitalTwin
  file: asyncroscopy/instruments/electron_microscope/digital_twin.py
  description: "Mapping digital twin: 2 um sample, stage error, drift, scan distortion, EDS spectra, dose"
  timeout_seconds: 120
  properties:
    # The procedural specimen (the default) is built from the sample_* and particle_* properties below.
    # Swap it without touching the instrument: digital_twin_recorded.yaml, digital_twin_crystal.yaml and
    # docs/Operation/specimens.md.
    specimen:
      source: procedural
      # The film varies in thickness at every length from 2 um down to 0.5 nm (30 % standard deviation, so it is
      # visible above shot noise), and atoms land at their sub-pixel positions: overlapping tiles can be registered
      # on the film anywhere, and one atomic column sits at one place in every frame that shows it.
      support_texture: 0.3
      support_texture_scale_m: 2.0e-6
      subpixel_atoms: true
    sample_seed: 12345
    sample_size_xy: 2.0e-6
    sample_particle_count: 400
    particle_radius_mean: 8.0e-9
    particle_radius_std: 4.0e-9
    particle_aspect_ratio: 0.6
    particle_elements: "Au,Pt,Fe,Pd"
    support_thickness: 1.0e-8
    acceleration_voltage: 300000
    convergence_angle_mrad: 30
    probe_current_pa: 50
    detector_read_noise: 0.5
    # The scanning detectors' gain swings by up to 10 % and their offset by up to 2 counts over tens of minutes,
    # so tiles taken far apart differ in brightness the way they do on the instrument.
    detector_gain_drift: 0.1
    detector_offset_drift: 2.0
    detector_offset: 5.0  # above the offset's swing, so dark pixels never clip at zero
    # Stage: Fiedler 2023 reports about +/-350 nm typical error; backlash, speed,
    # readback error and settling are unverified placeholders.
    stage_move_noise_std: 1.5e-7
    stage_bias_x: 1.0e-7
    stage_bias_y: -1.5e-7
    stage_reported_noise_std: 1.0e-8
    stage_backlash_x: 1.5e-7
    stage_backlash_y: 2.5e-7
    stage_speed: 5.0e-6
    stage_move_overhead: 1.0
    stage_settle_drift: 2.0e-9
    stage_settle_tau: 30
    # Thermo Fisher specifies <= 0.5 nm/min drift.
    drift_rate_per_min: 5.0e-10
    drift_random_walk: 2.0e-10
    scan_flyback_time: 5.0e-4
    scan_line_jitter_px: 0.3
    scan_shear: 0.005
    scan_rotation_deg: 0.3
    scan_flyback_compression: 0.05
    fov_scale_error: 0.01
    eds_fwhm_mn_ka: 130
    eds_solid_angle: 0.7
    eds_dead_time: 1.0e-6
    dose_tracking: true
    contamination_max: 3.0e-9
    contamination_dose: 1.0e4
    damage_critical_dose: 1.0e5
    time_scale: 1.0

devices:
  camera:
    module_name: asyncroscopy.instruments.electron_microscope.detectors.camera
  data:
    module_name: asyncroscopy.data.data
  eds:
    module_name: asyncroscopy.instruments.electron_microscope.detectors.eds
  scan:
    module_name: asyncroscopy.instruments.electron_microscope.hardware.scan
  # Background map jobs (reserve/start/status/abort/results/release) on this microscope.
  mapper:
    class_name: Mapper
    module_name: asyncroscopy.jobs.mapping.mapper
    properties:
      microscope_device_address: asyncroscopy/instrument/default
      scan_device_address: asyncroscopy/scan/default
      eds_device_address: asyncroscopy/eds/default
      data_device_address: asyncroscopy/data/default
      stage_device_address: asyncroscopy/stage/default
      # Finished maps are stitched on the pyTEMlib analysis server (start it as in the quickstart). The stitch's
      # stage error comes from the twin's STAGE device (position_sigma_m, from the twin's stage model).
      analysis_url: http://127.0.0.1:8003/mcp
      max_drift_m_per_s: 5.0e-11
  # Autofocus and stigmation jobs: run_job(device="Tuner", plan={...}); see docs/Operation/autofocus.md.
  # The twin's hidden focus error is set with its focus_offset_m / astigmatism_offset_*_m properties.
  tuner:
    class_name: Tuner
    module_name: asyncroscopy.jobs.tuning.tuner
    properties:
      microscope_device_address: asyncroscopy/instrument/default
      scan_device_address: asyncroscopy/scan/default
      corrector_device_address: asyncroscopy/corrector/default
      data_device_address: asyncroscopy/data/default
  # Approval mode (auto by default); switched from SciAgentGUI.
  approvals:
    class_name: Approvals
    module_name: asyncroscopy.safety.approvals
  stage:
    class_name: DigitalTwinSTAGE
    module_name: asyncroscopy.instruments.electron_microscope.hardware.stage_digital_twin
  corrector:
    class_name: DigitalTwinCorrector
    module_name: asyncroscopy.instruments.electron_microscope.hardware.corrector_digital_twin

tango:
  host: localhost
  port: 9094
  reset_database_file: true

tiled:
  host: localhost
  port: 9091
  acquisition_dir: outputs/tiled_acquisitions
  autostart: true
  register_on_startup: false

device_timeout_seconds: 120
