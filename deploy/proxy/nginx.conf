# Reference endpoint proxy for one asyncroscopy instrument (ATHENA WG1: "Endpoint Proxy - TLS
# encryption and token auth."). UNVALIDATED: no nginx was available where this was written; run
# `nginx -t -c <this file>` before use. WG1 owns the proxy blueprint; this is the instrument owner's
# starting point, and docs/Operation/remote_access.md explains each part.
#
# What it does:
#   * terminates TLS (certificates from your site's CA, or WG1's);
#   * forwards https://<instrument-host>/mcp          -> agent MCP endpoint   127.0.0.1:8000/mcp
#              https://<instrument-host>/analysis/mcp -> analysis server      127.0.0.1:8003/mcp
#              https://<instrument-host>:9443/        -> Tiled                127.0.0.1:9091
#   * passes the Authorization header through untouched: the MCP server verifies the WG1 token
#     itself (mcp.auth), so a request that slips past the proxy is still refused.
#
# The MCP servers and Tiled keep binding 127.0.0.1; only this proxy listens on the network.
# The operator endpoint (8001) is not forwarded: approving stays at the instrument (see the end).

worker_processes auto;
events { worker_connections 1024; }

http {
    # Streamable HTTP keeps a response open (server-sent events): no buffering, long reads.
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    upstream asyncroscopy_mcp      { server 127.0.0.1:8000; keepalive 16; }
    upstream asyncroscopy_analysis { server 127.0.0.1:8003; keepalive 16; }
    upstream asyncroscopy_tiled    { server 127.0.0.1:9091; keepalive 16; }

    # Reject requests with no bearer token at the edge; the MCP server still checks every token.
    map $http_authorization $has_bearer { default 0; "~*^Bearer\s+\S+" 1; }

    client_max_body_size 16m;
    server_tokens off;

    server {
        listen 80;
        server_name instrument.example.org;            # <- your instrument host
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name instrument.example.org;            # <- your instrument host

        ssl_certificate     /etc/asyncroscopy/tls/fullchain.pem;   # <- your certificate
        ssl_certificate_key /etc/asyncroscopy/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Optional: only WG1's endpoint API proxy or the VPN range may connect.
        # allow 10.0.0.0/8;
        # deny  all;

        location = /mcp {
            if ($has_bearer = 0) { return 401; }
            proxy_pass http://asyncroscopy_mcp/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;  # the WG1 token; the MCP server verifies it
            proxy_buffering off;                                 # server-sent events
            proxy_cache off;
            proxy_read_timeout 300s;                             # tools answer within 30 s; SSE streams stay open
            proxy_send_timeout 300s;
        }

        location /analysis/ {
            if ($has_bearer = 0) { return 401; }
            proxy_pass http://asyncroscopy_analysis/;          # /analysis/mcp -> /mcp
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;  # the WG1 token; the MCP server verifies it
            proxy_buffering off;                                 # server-sent events
            proxy_cache off;
            proxy_read_timeout 300s;                             # tools answer within 30 s; SSE streams stay open
            proxy_send_timeout 300s;
        }

        location / { return 404; }
    }

    # Tiled on its own port, so its URLs need no path prefix. Tiled checks its own API key
    # (ASYNCROSCOPY_TILED_API_KEY), a service-to-service secret; it does not read WG1 tokens.
    # Forward it only to networks that should hold that key (VPN, WG1's proxy), or not at all:
    # agents read data through the MCP endpoint's list_data / view_data, which the token gates.
    server {
        listen 9443 ssl;
        http2 on;
        server_name instrument.example.org;
        ssl_certificate     /etc/asyncroscopy/tls/fullchain.pem;
        ssl_certificate_key /etc/asyncroscopy/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # allow 10.0.0.0/8;   # <- the VPN range
        # deny  all;

        location / {
            proxy_pass http://asyncroscopy_tiled;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}

# --- the operator endpoint ----------------------------------------------------------------------
# Not forwarded by default. If WG1 decides approvers may decide remotely, forward it like /mcp on
# its own path (e.g. /operator/mcp -> 127.0.0.1:8001/mcp), set mcp.auth on the operator config
# too (approve, deny and set_mode then need the instrument:approve scope), and restrict it to
# the approvers' network.
