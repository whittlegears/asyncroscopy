# Multi-step goals: the agent has to plan several kinds of action and chain them.

workflows:
  - name: find_particle_then_eds
    request: Find a particle near the current position and take an EDS spectrum on it. Tell me which elements it contains.
    runners: [general]
    timeout_s: 900
    checks:
      - {check: called, tool: "*_acquire_scanned_image"}
      - {check: called, tool: "*_acquire_spectrum"}
      - {check: answer_eds_consistent}
      - {check: no_sleepwalking, allow: ["Mapper*", "*_acquire_*", "*_place_beam", "*_set_fov", "*_move_stage", "*_aim_image_shift", "*_set_image_shift", "*_unblank_beam", "*_blank_beam"]}

  - name: survey_rank_and_analyse
    # answer_eds_consistent checks the elements named, so the request asks for them (it once only said "take a spectrum").
    request: Make a 600 nm overview map around here, stitch it, list the three most interesting regions with their stage coordinates, then go to the best one, take an EDS spectrum there and tell me which elements it shows.
    runners: [general]
    timeout_s: 1500
    checks:
      - {check: job_finished}
      - {check: regions_scored}
      - {check: called, tool: "*_acquire_spectrum"}
      - {check: answer_eds_consistent}
      - {check: no_sleepwalking, allow: ["Mapper*", "*_acquire_*", "*_place_beam", "*_set_fov", "*_move_stage", "*_aim_image_shift", "*_set_image_shift", "*_unblank_beam", "*_blank_beam"]}

  - name: focus_series
    request: Take HAADF images at defocus -20 nm, 0 nm and +20 nm, then set the defocus back to 0.
    runners: [general]
    timeout_s: 600
    checks:
      - {check: called, tool: "*_set_defocus", min: 3}
      - {check: called, tool: "*_acquire_scanned_image", min: 3}
      - {check: param_near, name: defocus, value: 0.0, rel: 0.0, abs_tol: 1.0e-9}
      - {check: stage_unchanged}
      - {check: no_sleepwalking, allow: ["*_set_defocus", "*_acquire_scanned_image", "*_unblank_beam", "*_blank_beam"]}
