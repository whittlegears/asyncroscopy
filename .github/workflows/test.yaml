name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtango-dev

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # The agent and ollama extras carry the agent code's dependencies; without them those tests cannot import.
        run: uv sync --extra dev --extra agent --extra ollama --python 3.12

      # - name: Lint with ruff
      #   run: uv run ruff check .

      - name: Run tests
        run: uv run --no-sync pytest -q -m "not slow" -rs
