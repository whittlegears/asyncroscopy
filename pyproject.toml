# A real build backend makes uv install asyncroscopy itself (editable) into the
# venv, so `import asyncroscopy` works from notebooks/ or any other directory,
# not only from the repository root.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncroscopy"
version = "0.1.0"
description = "Asyncroscopy: asynchronous control framework for STEM automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "defusedxml>=0.7.1",
    "gevent>=25.9.1",
    "h5py>=3.15.1",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "lxml>=6.0.2",
    "matplotlib>=3.10.7",
    "multiprocess>=0.70.19",
    # Upper bounds on the fast-moving pre-1.0 and major-version dependencies: uv.lock is not
    # committed, so these keep a fresh clone from picking up a breaking release.
    "numpy>=2.3.5,<3",
    "pytango==10.1.2",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "scifireaders>=0.12.4,<0.13",
    "ase>=3.27.0",
    "pyTEMlib>=0.2024.1.0",
    "sidpy>=0.12.8,<0.13",
    "fastmcp>=0.1.0,<5",
    "anyio>=4.0.0",
    # AutoScript (local wheels)
    "autoscript-core",
    "autoscript-tem-microscope-client",
    #    "autoscript-tem-microscope-client-tests", -> version 1.17 doesnt have this
    #    "autoscript-tem-snippets-tests", -> version 1.17 doesnt have this
    "autoscript-tem-toolkit",
    "thermoscientific-logging",
    # PyJEM / JEOL (local wheel)
    "pyjem",
    "aicspylibczi>=3.3.1",
    "jupyter-book>=2.0.0",
    "tiled[all]>=0.2.9,<0.3",
    "pyyaml>=6.0.3",
    "pyqt5>=5.15.11,<5.16; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pyqt5-qt5==5.15.2; sys_platform == 'win32'",
    "pyqt6>=6.8,<6.10",
    "ipympl>=0.10.0",
    "tifffile>=2026.5.15",
    "pyro5>=5.17",
    # Finding stale listeners and device servers at launch (process_manager).
    "psutil>=5.9",
]

[project.optional-dependencies]
# Install the abTEM diffraction twin stack with:
#     uv sync --extra diffraction
diffraction = [
    "abtem>=1.0.0",
    "ase>=3.27.0",
    "quantem>=0.1.9",
]

agent = [
    "langchain<2",
    "langchain-openai",
    "langgraph<2",
    "langchain-mcp-adapters",    
]

jupiter = [
    "aespm>=1.1.4",
]

ollama = [
    "langchain_ollama"
]

# LangGraph Studio (`uv run langgraph dev`) and other developer tools:
#     uv sync --extra agent --extra ollama --extra dev
dev = [
    "langgraph-cli[inmem]",
]

# Install SAM2 segmentation support with:
#     uv sync --extra segment
segment = [
    "huggingface-hub",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
    "torch",
    "torchvision",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
# Only the library: tests/, notebooks/, startup_scripts/, startup_guis/, stubs/ stay out.
where = ["."]
include = ["asyncroscopy", "asyncroscopy.*"]

[tool.setuptools.package-data]
# Schemas and agent skills ship with the package so an installed copy can use them.
asyncroscopy = ["contracts/*.json", "contracts/*.md", "skills/*/SKILL.md", "skills/README.md", "instruments/yaml_sim/examples/*.yaml"]

[tool.uv.sources]
autoscript-core = { path = "stubs/AutoScript_v_1.18/autoscript_core-1.4.0-py3-none-any.whl" }
autoscript-tem-microscope-client = { path = "stubs/AutoScript_v_1.18/autoscript_tem_microscope_client-1.18.0-py3-none-any.whl" }
autoscript-tem-toolkit = { path = "stubs/AutoScript_v_1.18/autoscript_tem_toolkit-1.18.0-py3-none-any.whl" }
thermoscientific-logging = { path = "stubs/AutoScript_v_1.18/thermoscientific_logging-1.4.0-py3-none-any.whl" }
pyjem = { path = "stubs/PyJEM_v_1.3.0.3564/PyJEM-1.3.0.3564-py3-none-any.whl" }
# The map/analysis MCP server and the stitcher live in a pyTEMlib fork branch
# (whittlegears/pyTEMlib, branch feature/mcp-mapping) until they are merged upstream
# (pycroscopy/pyTEMlib); then this line goes and a PyPI pyTEMlib release is used.
# Pinned to a commit so every fresh `uv sync` (uv.lock is not committed) gets the same code.
pytemlib = { git = "https://github.com/whittlegears/pyTEMlib", rev = "b8eecfdc852bed6e2bee1822d4bd395965383ebc" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[tool.uv]
override-dependencies = [
    "numpy>=2.3.5",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
